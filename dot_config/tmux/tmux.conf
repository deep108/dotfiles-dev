# Guest tmux config (hosts don't get it: .chezmoiignore).

# tmux 3.7 allows '.', ':' and empty session names (3.6 turned '.' and ':' into '_'), but -t
# can't address them: 'a.b' reads as session a, pane b. vm-tools refuses such names, so put
# 3.6's rule back ('#' goes too), adding -<id> when that name is taken, and give an empty name
# the session's id number (tmux's own default name). Harmless on 3.6, which never makes them.
set-hook -g session-created 'if -F "#{m/r:[.#:],#{session_name}}" "rename-session -- \"#{s/[.#:]/_/:session_name}\"" ; if -F "#{m/r:[.#:],#{session_name}}" "rename-session -- \"#{s/[.#:]/_/:session_name}-#{s/[$]//:session_id}\"" ; if -F "#{==:#{session_name},}" "rename-session -- \"#{s/[$]//:session_id}\""'
set-hook -g session-renamed 'if -F "#{m/r:[.#:],#{session_name}}" "rename-session -- \"#{s/[.#:]/_/:session_name}\"" ; if -F "#{m/r:[.#:],#{session_name}}" "rename-session -- \"#{s/[.#:]/_/:session_name}-#{s/[$]//:session_id}\"" ; if -F "#{==:#{session_name},}" "rename-session -- \"#{s/[$]//:session_id}\""'
